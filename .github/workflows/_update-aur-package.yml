name: Update one AUR package

on:
  workflow_call:
    inputs:
      pkgbase:
        required: true
        type: string
      publish:
        type: boolean
        default: true
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container: archlinux:base-devel
    outputs:
      needs_publish: ${{ steps.prepare.outputs.needs_publish }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git python nvchecker pyalpm pacman-contrib namcap sudo
          useradd -m builder
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare package update
        id: prepare
        env:
          PKGBASE: ${{ inputs.pkgbase }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # Forward builder's result without changing ownership of runner metadata.
          runuser -u builder -- env -u GITHUB_OUTPUT python automation/package.py prepare "$PKGBASE" --workdir /home/builder/build | tee -a "$GITHUB_OUTPUT"
      - name: Build, lint, install, and check the package
        if: steps.prepare.outputs.needs_publish == 'true'
        env:
          PKGBASE: ${{ inputs.pkgbase }}
        run: runuser -u builder -- bash automation/validate.sh "$PKGBASE" /home/builder/build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.prepare.outputs.needs_publish == 'true'
        with:
          name: package-${{ inputs.pkgbase }}
          path: /home/builder/build/recipe.tar
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: inputs.publish && needs.build.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: aur-repository-publisher
      queue: max
    container: archlinux:base-devel
    steps:
      - name: Install publication tools
        run: pacman -Syu --noconfirm --needed git python aurpublish openssh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/package
          merge-multiple: true
      - name: Publish checked files to GitHub and AUR
        env:
          PKGBASE: ${{ inputs.pkgbase }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          [[ -n "$AUR_SSH_PRIVATE_KEY" ]] || { echo 'AUR_SSH_PRIVATE_KEY is required for publication' >&2; exit 1; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          umask 077
          key="$RUNNER_TEMP/aur-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key"
          unset AUR_SSH_PRIVATE_KEY
          export GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$GITHUB_WORKSPACE/automation/aur_known_hosts'"
          python automation/package.py publish "$PKGBASE" --archive "$RUNNER_TEMP/package/recipe.tar" --branch "$DEFAULT_BRANCH"
